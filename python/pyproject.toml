[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-ingest"
version = "0.1.0"
description = "Reverse engineering of NASA's current public Lunar Curation website"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
lunar-ingest = "lunar_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunar_ingest = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
